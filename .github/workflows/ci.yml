name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,openai,telemetry]"
      - run: ruff check .
      - name: Offline unit and recorded-transport tests
        run: pytest tests

  minimal-client:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Verify credential-free client imports without optional SDKs
        run: >-
          pytest tests/test_pipeline.py tests/test_question_generator.py
          tests/test_answer_evaluator.py tests/test_feedback.py tests/test_metrics.py
          tests/test_telemetry.py::test_error_context_without_telemetry
